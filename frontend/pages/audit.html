<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>clouDBills &middot; Audit</title>
  <meta name="theme-color" content="#eceee8">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="audit">
  <header id="app-header"></header>

  <main id="main">
    <div class="page-head">
      <div>
        <h1>Audit trail</h1>
        <p>An append-only record of resource changes, approval decisions and remediation actions.</p>
      </div>
      <div class="page-actions">
        <button class="btn" id="refresh-audit">Refresh</button>
      </div>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="audit-search" placeholder="Filter by action, entity or user…" aria-label="Filter audit entries" style="min-width:280px">
        <div class="spacer"></div>
        <span class="muted small" id="audit-count"></span>
      </div>
      <div class="table-wrap table-wide">
        <table>
          <thead>
            <tr><th>Timestamp</th><th>Action</th><th>Entity</th><th>Actor</th>
              <th>Previous state</th><th>New state</th><th>Client IP</th></tr>
          </thead>
          <tbody id="audit-body"><tr><td colspan="7" class="empty">Loading audit entries…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/layout.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/audit.js" defer></script>
</body>
</html>
